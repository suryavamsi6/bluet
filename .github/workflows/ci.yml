name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_aur:
        description: "Run the AUR publish step against the current Cargo.toml version"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libpulse-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: D-Bus integration test
        run: |
          dbus-run-session -- sh -c \
            'DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" cargo test --locked --test dbus_integration'

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --check

  build:
    name: Build release binary and tarball
    # Built on the oldest supported Ubuntu LTS so the binary needs only
    # glibc 2.35, and therefore runs on most current distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libpulse-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Package the tarball
        run: |
          ./scripts/package-tarball.sh
          tar -tzvf dist/bluet-*-x86_64-linux.tar.gz
          echo "Highest glibc symbol the binary needs:"
          objdump -T dist/tarball/*/bin/bluet | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

      - name: Check the tarball installs and its launcher validates
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          work="$(mktemp -d)"
          tar -xzf dist/bluet-*-x86_64-linux.tar.gz -C "$work"
          PREFIX="$work/prefix" "$work"/bluet-*/install.sh
          test -x "$work/prefix/bin/bluet"
          desktop-file-validate "$work/prefix/share/applications/dev.bluet.manager.desktop"
          PREFIX="$work/prefix" "$work"/bluet-*/install.sh --uninstall
          test ! -e "$work/prefix/bin/bluet"

      - name: Collect release files
        run: |
          install -Dm755 dist/tarball/*/bin/bluet release/bluet
          cp dist/bluet-*-x86_64-linux.tar.gz dist/bluet-*-x86_64-linux.tar.gz.sha256 release/

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: bluet-x86_64-linux
          path: release/
          if-no-files-found: error

  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Generate offline cargo sources from Cargo.lock
        run: |
          if ! command -v python3 >/dev/null || ! python3 -m venv --help >/dev/null 2>&1; then
            dnf install -y python3 || apt-get install -y python3 python3-venv
          fi
          packaging/flatpak/update-cargo-sources.sh

      - name: Validate desktop file and metainfo
        run: |
          desktop-file-validate packaging/linux/dev.bluet.manager.desktop
          appstreamcli validate --no-net --explain \
            packaging/flatpak/io.github.suryavamsi6.bluet.metainfo.xml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.suryavamsi6.bluet.yml
          bundle: bluet-x86_64.flatpak
          artifact-name: bluet-x86_64-flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}

      - name: Check the bundle installs and can run pactl
        run: |
          flatpak install --user -y --noninteractive bluet-x86_64.flatpak
          flatpak info --user io.github.suryavamsi6.bluet
          flatpak run --user --command=pactl io.github.suryavamsi6.bluet --version

  release:
    name: Attach files to the release
    needs: [test, build, flatpak]
    # Only a tag is a release. A manual publish_aur run has no tag. A failed
    # Flatpak build must not hold back the binary and tarball.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.test.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluet-x86_64-linux
          path: release

      - uses: actions/download-artifact@v4
        if: needs.flatpak.result == 'success'
        with:
          name: bluet-x86_64-flatpak
          path: release

      - name: Create the release once, then attach files
        # Notes are generated only when the release is created, so re-running
        # this job replaces the files instead of appending the notes again.
        run: |
          ls -l release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber

  aur:
    name: Publish to the AUR
    needs: [test, build]
    # A recipe embeds a checksum of the release archive, and that archive is
    # built from the committed tree with every file stamped at the commit time,
    # so a committed recipe can never describe the archive that contains it.
    # The recipe is therefore generated from the published tag here and pushed
    # to the AUR, which versions it from then on.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_aur
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          # A manual run has no tag to compare against; it exercises the same
          # steps against whatever Cargo.toml currently says.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}."
            exit 1
          fi
          echo "Preparing the AUR recipe for Bluet ${version}"

      - name: Generate the recipe from the published archive
        # package-aur.sh exits 3 when the tag is not served yet, which is the
        # only failure worth retrying; a build failure must fail at once.
        run: |
          for attempt in 1 2 3 4 5 6; do
            rc=0
            ./scripts/package-aur.sh || rc=$?
            if (( rc == 0 )); then
              echo "--- PKGBUILD ---"
              cat dist/aur/PKGBUILD
              exit 0
            fi
            if (( rc != 3 )); then
              echo "::error::package-aur.sh failed with exit ${rc}."
              exit $rc
            fi
            echo "Tag archive not published yet (attempt ${attempt}/6); retrying in 15s."
            sleep 15
          done
          echo "::error::Tag ${GITHUB_REF_NAME} never became available on GitHub."
          exit 1

      - name: Check the recipe against the archive it names
        run: ./scripts/check-aur-recipe.sh

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_PKGNAME: bluet
        run: |
          # Take the version from the recipe, not from the ref: a manual run has
          # the branch name there, which is not a version at all.
          VERSION="$(sed -n 's/^pkgver=//p' dist/aur/PKGBUILD | head -n 1)"

          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            # A warning rather than a plain success, so a green check cannot be
            # mistaken for "the AUR has this version".
            echo "::warning title=AUR not published::AUR_SSH_PRIVATE_KEY is unset," \
                 "so the ${VERSION} recipe was generated and verified but not pushed."
            exit 0
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"

          # The AUR has no submission form: a package exists as soon as something is
          # pushed to its git repo, and the first push creates it. So a failure here
          # means the SSH key is not the one registered on the AUR account, not that
          # the package needs to be created somewhere.
          if ! git clone --depth 1 "ssh://aur@aur.archlinux.org/${AUR_PKGNAME}.git" aur-repo; then
            echo "::error::Could not clone the AUR package. Check that AUR_SSH_PRIVATE_KEY" \
                 "is the private half of the key registered in the AUR account settings."
            exit 1
          fi

          cp dist/aur/PKGBUILD dist/aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "${AUR_USERNAME:-bluet CI}"
          git config user.email "${AUR_EMAIL:-bluet@localhost}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already carries ${VERSION}."
            exit 0
          fi
          git commit -q -m "upgpkg: ${AUR_PKGNAME} ${VERSION}-1"
          git push origin HEAD:master
          echo "Published ${AUR_PKGNAME} ${VERSION}-1 to the AUR."
