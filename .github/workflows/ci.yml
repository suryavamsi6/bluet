name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libpulse-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --locked --lib --bins

      - name: D-Bus integration test
        run: |
          dbus-run-session -- sh -c \
            'DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" cargo test --locked --test dbus_integration'

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --check

  build:
    name: Build release binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libpulse-dev libvulkan-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bluet-x86_64-linux
          path: target/release/bluet
          if-no-files-found: error

  release:
    name: Attach binary to the release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bluet-x86_64-linux

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: bluet
          generate_release_notes: true

  aur:
    name: Publish to the AUR
    needs: [test, build]
    # A recipe embeds a checksum of the release archive, and that archive is
    # built from the committed tree with every file stamped at the commit time,
    # so a committed recipe can never describe the archive that contains it.
    # The recipe is therefore generated from the published tag here and pushed
    # to the AUR, which versions it from then on.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}."
            exit 1
          fi
          echo "Releasing Bluet ${version}"

      - name: Generate the recipe from the published archive
        # package-aur.sh exits 3 when the tag is not served yet, which is the
        # only failure worth retrying; a build failure must fail at once.
        run: |
          for attempt in 1 2 3 4 5 6; do
            rc=0
            ./scripts/package-aur.sh || rc=$?
            if (( rc == 0 )); then
              echo "--- PKGBUILD ---"
              cat dist/aur/PKGBUILD
              exit 0
            fi
            if (( rc != 3 )); then
              echo "::error::package-aur.sh failed with exit ${rc}."
              exit $rc
            fi
            echo "Tag archive not published yet (attempt ${attempt}/6); retrying in 15s."
            sleep 15
          done
          echo "::error::Tag ${GITHUB_REF_NAME} never became available on GitHub."
          exit 1

      - name: Check the recipe against the archive it names
        run: ./scripts/check-aur-recipe.sh

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_PKGNAME: bluet
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            # A warning rather than a plain success, so a green check cannot be
            # mistaken for "the AUR has this version".
            echo "::warning title=AUR not published::AUR_SSH_PRIVATE_KEY is unset," \
                 "so the ${VERSION} recipe was generated and verified but not pushed."
            exit 0
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"

          # The AUR has no submission form: a package exists as soon as something is
          # pushed to its git repo, and the first push creates it. So a failure here
          # means the SSH key is not the one registered on the AUR account, not that
          # the package needs to be created somewhere.
          if ! git clone --depth 1 "ssh://aur@aur.archlinux.org/${AUR_PKGNAME}.git" aur-repo; then
            echo "::error::Could not clone the AUR package. Check that AUR_SSH_PRIVATE_KEY" \
                 "is the private half of the key registered in the AUR account settings."
            exit 1
          fi

          cp dist/aur/PKGBUILD dist/aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "${AUR_USERNAME:-bluet CI}"
          git config user.email "${AUR_EMAIL:-bluet@localhost}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already carries ${VERSION}."
            exit 0
          fi
          git commit -q -m "upgpkg: ${AUR_PKGNAME} ${VERSION#v}-1"
          git push origin HEAD:master
